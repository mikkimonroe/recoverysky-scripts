services:
  recoverysky-zoom-proxy:
    container_name: recoverysky-zoom-proxy
    image: 306057522130.dkr.ecr.us-east-1.amazonaws.com/recoverysky/recoverysky-zoom-proxy:latest
    ports:
      - "80:80"
      - "443:443"
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - recoverysky-zoom-api
      - recoverysky-zoom-app